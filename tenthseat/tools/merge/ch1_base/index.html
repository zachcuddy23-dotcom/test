<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>The Tenth Seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --bg: #05060f; --btn: rgba(255,255,255,0.14); --btn-on: rgba(255,224,112,0.45); --btn-border: rgba(255,255,255,0.35); --ink: #e8e8ff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #05060f; } }
  :root[data-theme="dark"] { --bg: #05060f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #wrap { width: 100vw; max-width: calc(100vh * 1.5); aspect-ratio: 3 / 2; position: relative; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; background: #000; }
  #dbg { position: absolute; top: 6px; right: 6px; font: 9px "Press Start 2P", monospace; color: #ffe070; background: rgba(20,10,40,0.7); border: 1px solid rgba(255,224,112,0.5); border-radius: 6px; padding: 5px 7px; cursor: pointer; opacity: 0.55; }
  #dbg:hover, #dbg:focus-visible { opacity: 1; }
  #touch { display: none; width: 100%; max-width: 640px; padding: 12px 16px 20px; box-sizing: border-box; justify-content: space-between; align-items: center; }
  body.touch #touch { display: flex; }
  body.touch #wrap { max-width: calc((100vh - 200px) * 1.5); }
  .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; }
  .b { background: var(--btn); border: 2px solid var(--btn-border); border-radius: 12px; display: flex; align-items: center; justify-content: center; font: 14px "Press Start 2P", monospace; color: var(--ink); touch-action: none; }
  .b.on { background: var(--btn-on); }
  .ab { display: flex; gap: 10px; align-items: center; }
  .ab .b { width: 58px; height: 58px; border-radius: 50%; }
  .ab .small { width: 48px; height: 36px; border-radius: 10px; font-size: 9px; }
  @media (orientation: landscape) {
    body.touch #wrap { max-width: min(calc(100vh * 1.5), calc(100vw - 340px)); }
    body.touch #touch { position: fixed; inset: 0; pointer-events: none; padding: 0; max-width: none; }
    body.touch .dpad, body.touch .ab { position: absolute; bottom: 20px; pointer-events: auto; }
    body.touch .dpad { left: 12px; }
    body.touch .ab { right: 12px; width: 136px; flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas><button id="dbg" type="button" title="Debug menu (F2)">DEBUG</button></div>
<div id="touch">
  <div class="dpad">
    <span></span><div class="b" data-btn="up">▲</div><span></span>
    <div class="b" data-btn="left">◀</div><span></span><div class="b" data-btn="right">▶</div>
    <span></span><div class="b" data-btn="down">▼</div><span></span>
  </div>
  <div class="ab">
    <div class="b small" data-btn="menu">MENU</div>
    <div class="b" data-btn="b">B</div>
    <div class="b" data-btn="a">A</div>
  </div>
</div>
<script src="js/assets.js"></script>
<script src="js/core.js"></script>
<script src="js/gfx.js"></script>
<script src="js/tiles.js"></script>
<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/music.js"></script>
<script src="js/party.js"></script>
<script src="js/maps.js"></script>
<script src="js/events.js"></script>
<script src="js/ui.js"></script>
<script src="js/field.js"></script>
<script src="js/battle.js"></script>
<script src="js/cinema.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
